<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motoranschluss auswählen</title><style>body{font:16px system-ui;background:#eef3f5;color:#18394a;margin:0}main{max-width:1100px;margin:auto;padding:24px}select{font:inherit;padding:10px}img{width:100%;height:auto}aside{background:#fff3d9;padding:14px;margin:16px 0}dl{display:grid;grid-template-columns:200px 1fr;gap:8px}dd{margin:0}</style><main><h1>Motoranschluss V1–V4</h1><label>Variante <select id="variant"></select></label><aside>Konzeptvergleich: Die Auswahl ändert das angezeigte Bild und die Parameter. Die native CAD-Baugruppe wird dadurch noch nicht umgebaut.</aside><dl><dt>Rohre je Motor</dt><dd id="count"></dd><dt>Rohrquerschnitt</dt><dd id="size"></dd><dt>Rahmen- und Motoraufnahme</dt><dd id="design"></dd><dt>Offener Nachweis</dt><dd id="risk"></dd></dl><img id="image" alt="Gewählte Motoranschlussvariante"><p><a href="README.md">Rechenannahmen und alle Varianten</a></p></main><script>const variants=[{"id": "V1", "title": "Einrohrarm", "count": 1, "od": 35, "di": 32, "start": [[0, 0, -30]], "end": [[385, 0, -30]], "purpose": "Ein größerer dünnwandiger Querschnitt mit nur zwei Rohr-Klemmstellen; erste Gewichtsoption.", "risk": "Neuer Rohrartikel erforderlich. Bestehendes Ø20/17 und größerer Ø35/32 werden getrennt gescreent; Laminat und Anschlüsse offen."}, {"id": "V2", "title": "Vertikale V-Gabel", "count": 2, "od": 20, "di": 17, "start": [[0, 0, -20], [0, 0, -120]], "end": [[385, 0, -20], [385, 0, -60]], "purpose": "Zwei vorhandene Rohre übereinander; Bauhöhe als Hebelarm für die vertikale Last nutzen.", "risk": "Seitliche Steifigkeit, Torsion und biegesteife Klemmstellen prüfen."}, {"id": "V3", "title": "Horizontale V-Gabel", "count": 2, "od": 20, "di": 17, "start": [[0, -60, -30], [0, 60, -30]], "end": [[385, -22, -20], [385, 22, -20]], "purpose": "Zwei vorhandene Rohre in der Draufsicht als V; kleine flache Anschlussknoten.", "risk": "Vertikale Biegung und Verdrehung benötigen einen eigenen Nachweis."}, {"id": "V4", "title": "Räumliches Dreieck", "count": 3, "od": 20, "di": 17, "start": [[0, -60, -20], [0, 60, -20], [0, 0, -100]], "end": [[385, -25, -20], [385, 25, -20], [385, 0, -60]], "purpose": "Zwei obere und ein unteres Rohr; räumlicher Querschnitt mit direktem Dreifach-Motorknoten.", "risk": "Zusatzrohr und zusätzliche Klemmstellen nur bei nachgewiesenem Steifigkeitsnutzen."}],select=document.getElementById('variant');for(const v of variants){const o=document.createElement('option');o.value=v.id;o.textContent=v.id+' – '+v.title;select.append(o)}function update(){const v=variants.find(x=>x.id===select.value);document.getElementById('count').textContent=v.count;document.getElementById('size').textContent='Ø'+v.od+'/'+v.di+' mm';document.getElementById('design').textContent=v.purpose;document.getElementById('risk').textContent=v.risk;document.getElementById('image').src=v.id+'.png';document.getElementById('image').alt=v.title;localStorage.setItem('propboard_motoranschluss_variante',v.id)}select.value=variants.some(v=>v.id===localStorage.getItem('propboard_motoranschluss_variante'))?localStorage.getItem('propboard_motoranschluss_variante'):'V3';select.onchange=update;update();</script></html>
